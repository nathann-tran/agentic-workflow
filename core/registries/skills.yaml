registry_version: "1.0"
core_version: "0.1.0"
source_snapshot:
  runtime: "OpenCode 2.2.6"
  captured_at: "2026-11-08"
  basis: "User-provided runtime skill catalog and explicit-load test"
  status_values:
    verified_available: "The runtime loaded the skill in a test session."
    verified_present: "The skill folder exists in every documented skill root; runtime load is not yet tested."

activation_levels:
  - required
  - conditional
  - explicit
  - blocked

skills:
  - canonical_id: brainstorming
    source: superpowers
    owners: [plan, architect]
    activation: required
    trigger: "New or ambiguous creative work. Do not repeat after approved requirements."
    opencode:
      runtime_id: brainstorming
      status: verified_available
    other_harnesses: unverified

  - canonical_id: superpowers_bootstrap
    source: superpowers
    owners: [all]
    activation: conditional
    trigger: "Use when the Superpowers plugin is installed and active in the current session."
    opencode:
      runtime_id: using-superpowers
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: verify_before_completion
    source: superpowers
    owners: [all]
    activation: required
    trigger: "Before every completion claim. The Core verification policy remains required without this skill."
    opencode:
      runtime_id: verification-before-completion
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: implement_workflow
    source: mattpocock/skills
    owners: [builder]
    activation: explicit
    trigger: "Builder receives an approved implementation task with an enforceable write scope."
    dependencies: [tdd_guidance]
    opencode:
      runtime_id: implement
      status: explicit_load_verified
    other_harnesses: adapter_mapping_required
    constraints:
      - "Its referenced code-review step must map to the Core Worker review contract."
      - "Do not run its parallel reviewer topology when that conflicts with the Core delegation policy."
      - "Loading this skill does not grant source-write permission."

  - canonical_id: tdd_workflow
    source: superpowers
    owners: [builder]
    activation: required
    trigger: "Every feature or bug fix."
    opencode:
      runtime_id: test-driven-development
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: tdd_guidance
    source: global-skill
    owners: [builder]
    activation: required
    trigger: "Supplement the TDD workflow with local test guidance."
    opencode:
      runtime_id: tdd
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: ponytail_minimality
    source: dietrichgebert/ponytail
    owners: [builder]
    activation: required
    trigger: "Every coding task when the Ponytail plugin is available. Use full mode by default."
    opencode:
      runtime_id: ponytail
      status: verified_available
      plugin_version: "4.10.3"
    other_harnesses: plugin_or_policy_fallback

  - canonical_id: ponytail_review
    source: dietrichgebert/ponytail
    owners: [builder]
    activation: conditional
    trigger: "Review changed code for unnecessary abstractions, dependencies, or dead flexibility."
    opencode:
      runtime_id: ponytail-review
      status: verified_available
      plugin_version: "4.10.3"
    other_harnesses: policy_fallback

  - canonical_id: grill_me
    source: mattpocock/skills
    owners: [plan]
    activation: explicit
    trigger: "Human explicitly requests an interview without documentation updates."
    dependencies: [grilling]
    opencode:
      runtime_id: grill-me
      status: explicit_load_verified
    other_harnesses: adapter_mapping_required

  - canonical_id: grill_with_docs
    source: mattpocock/skills
    owners: [plan]
    activation: explicit
    trigger: "Human explicitly requests an interview with domain-document updates."
    dependencies: [grilling, domain_modeling]
    opencode:
      runtime_id: grill-with-docs
      status: explicit_load_verified
    other_harnesses: adapter_mapping_required

  - canonical_id: grilling
    source: mattpocock/skills
    owners: [plan]
    activation: conditional
    trigger: "Dependency of Grill Me or Grill With Docs."
    opencode:
      runtime_id: grilling
      status: explicit_load_verified
    other_harnesses: adapter_mapping_required

  - canonical_id: domain_modeling
    source: global-skill
    owners: [plan, architect]
    activation: conditional
    trigger: "Clarify domain terms, invariants, CONTEXT.md, or ADRs."
    opencode:
      runtime_id: domain-modeling
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: writing_plans
    source: superpowers
    owners: [plan]
    activation: conditional
    trigger: "A multi-step implementation plan requires explicit decomposition."
    opencode:
      runtime_id: writing-plans
      status: verified_available
    other_harnesses: adapter_mapping_required

  - canonical_id: to_spec
    source: mattpocock/skills
    owners: [plan]
    activation: explicit
    trigger: "Human requests specification output and required tracker context is configured."
    opencode:
      runtime_id: to-spec
      status: explicit_load_verified
    other_harnesses: adapter_mapping_required
    constraints: [tracker_configuration_required, human_approval_before_publication]

  - canonical_id: to_tickets
    source: mattpocock/skills
    owners: [plan, conductor]
    activation: explicit
    trigger: "Human requests ticket creation and tracker context is configured."
    opencode:
