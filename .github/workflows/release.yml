name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make validate
      - run: make release
      - run: cd dist && sha256sum -c SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AWM $GITHUB_REF_NAME" \
            --generate-notes \
            dist/RELEASE-MANIFEST.json dist/SHA256SUMS.txt dist/awm-* dist/awm_*
